name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Same Java version as gradle/gradle-daemon-jvm.properties (and Android Studio's bundled JDK).
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Also validates the Gradle wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # No API key here: BuildConfig.ANTHROPIC_API_KEY is empty and the build still works.
      - name: Build, run unit tests and checks
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug ktlintCheck

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
